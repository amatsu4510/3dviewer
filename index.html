<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>CesiumJS 3D Model Viewer</title>
  <link
    href="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a1a3f;
    }
    #cesiumContainer {
      width: 100vw;
      height: 100vh;
      position: absolute;
      inset: 0;
    }
    #hint {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 8px 12px;
      color: #eee;
      font-family: sans-serif;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 6px;
      pointer-events: none;
      user-select: none;
    }
    #modelPanel {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      padding: 8px 12px;
      color: #eee;
      font-family: sans-serif;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #modelSelect {
      background: #111;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="hint">
    左ドラッグ: 回転 (クオータニオン) / 右ドラッグ: ズーム
  </div>
  <div id="modelPanel">
    <label for="modelSelect">Model:</label>
    <select id="modelSelect"></select>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Cesium.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
